# Tooling configuration for the Python Spatial SDK Governance Hub.
#
# This repository is a documentation/telemetry generator rather than an
# installable distribution, so only linter and test settings are defined here.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra"
